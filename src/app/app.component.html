@if (loading.isLoading()) {
  <div class="global-loader" role="status" aria-live="polite" aria-busy="true">
    <div class="global-loader__backdrop"></div>
    <div class="global-loader__panel">
      <svg class="global-loader__spinner" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle
          class="global-loader__track"
          cx="12"
          cy="12"
          r="10"
          stroke="currentColor"
          stroke-width="3"
        />
        <path
          class="global-loader__arc"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          d="M12 2a10 10 0 0 1 10 10"
        />
      </svg>
      <span class="global-loader__label">Loading…</span>
    </div>
  </div>
}
<router-outlet></router-outlet>
<app-notification></app-notification>
