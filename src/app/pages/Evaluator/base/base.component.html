<div class="evaluator-container">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1 class="app-name">EvalEase</h1>
      <p class="portal-name">Evaluator Portal</p>
    </div>

    <nav class="sidebar-nav">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.route === 'dashboard' }"
          class="nav-item"
        >
          <svg
            class="nav-icon"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            @if (item.icon === 'home') {
              <path
                d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"
              />
            }
            @if (item.icon === 'book') {
              <path
                d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"
              />
            }
            @if (item.icon === 'briefcase') {
              <path
                d="M20.25 14.15v4.25c0 1.094-.787 2.036-1.872 2.18-1.051.162-2.132.35-3.378.35-1.246 0-2.327-.188-3.378-.35-1.085-.144-1.872-1.086-1.872-2.18v-4.25m16.5 0a2.18 2.18 0 00.75-1.661V8.706c0-1.081-.768-2.015-1.837-2.175a48.114 48.114 0 00-3.413-.364m0 0a48.38 48.38 0 013.413-.364m0 0a48.38 48.38 0 00-3.413-.364m0 0a48.38 48.38 0 013.413-.364M12 9.75c2.294 0 4.17-.984 4.17-2.25s-1.876-2.25-4.17-2.25S7.83 6.234 7.83 7.5 9.706 9.75 12 9.75zM8.25 19.5h7.5c.621 0 1.125-.504 1.125-1.125V18.75c0-.621-.504-1.125-1.125-1.125H8.25c-.621 0-1.125.504-1.125 1.125v.625c0 .621.504 1.125 1.125 1.125z"
              />
            }
            @if (item.icon === 'clipboard') {
              <path
                d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"
              />
            }
            @if (item.icon === 'person-add') {
              <path
                d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zM4.5 19.125h15a1.125 1.125 0 001.125-1.125v-1.5a4.125 4.125 0 00-4.125-4.125H7.5a4.125 4.125 0 00-4.125 4.125v1.125c0 .621.504 1.125 1.125 1.125z"
              />
            }
            @if (item.icon === 'verified') {
              <path
                d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"
              />
            }
            @if (item.icon === 'people') {
              <path
                d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.746 0 9.337 9.337 0 004.121.952 9.38 9.38 0 002.625-.372m0 0a8.963 8.963 0 01-.622-.687 4.125 4.125 0 00-7.746 0c-.233.26-.465.515-.622.687m0 0a8.963 8.963 0 01-.622-.687 4.125 4.125 0 00-7.746 0 8.963 8.963 0 01-.622.687m16.5 0a8.963 8.963 0 01-.622-.687 4.125 4.125 0 00-7.746 0c-.233.26-.465.515-.622.687M12 9.75a3.75 3.75 0 10-7.5 0 3.75 3.75 0 007.5 0z"
              />
            }
            @if (item.icon === 'bar-chart') {
              <path
                d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z"
              />
            }
          </svg>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <p class="logged-in-text">Logged in as:</p>
      <p class="logged-in-name">{{ loggedInUser }}</p>
      <button type="button" class="logout-button" (click)="logout()">
        <svg
          class="logout-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"
          />
        </svg>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
