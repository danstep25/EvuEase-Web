<div class="evaluator-container">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1 class="app-name">EvalEase</h1>
      <p class="portal-name">Evaluator Portal</p>
    </div>

    <nav class="sidebar-nav">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.route === 'dashboard' }"
          class="nav-item"
        >
          <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
            @if (item.icon === 'home') {
              <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
            }
            @if (item.icon === 'briefcase') {
              <path
                d="M20 6h-3V4c0-1.11-.89-2-2-2H9c-1.11 0-2 .89-2 2v2H4c-1.11 0-2 .89-2 2v11c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zM9 4h6v2H9V4zm11 15H4v-9h16v9zm-7-7h-2v-2h2v2z"
              />
            }
            @if (item.icon === 'clipboard') {
              <path
                d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 16H5V5h2v2h10V5h2v14z"
              />
            }
            @if (item.icon === 'people') {
              <path
                d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"
              />
            }
            @if (item.icon === 'bar-chart') {
              <path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z" />
            }
          </svg>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <p class="logged-in-text">Logged in as:</p>
      <p class="logged-in-name">{{ loggedInUser }}</p>
      <button type="button" class="logout-button" (click)="logout()">
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
