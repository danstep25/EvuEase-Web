@if (isOpen && miscellaneousFee) {
  <div class="curriculum-view__tuition-delete-overlay" role="presentation" (click)="onBackdropClick()">
    <div
      class="curriculum-view__tuition-delete-dialog"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="evaluator-misc-fee-delete-message"
      aria-describedby="evaluator-misc-fee-delete-detail"
      (click)="$event.stopPropagation()"
    >
      <button type="button" class="curriculum-view__tuition-delete-close" (click)="onCancel()" aria-label="Close">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <div class="curriculum-view__tuition-delete-body">
        <div class="curriculum-view__tuition-delete-icon-wrap" aria-hidden="true">
          <svg class="curriculum-view__tuition-delete-icon" fill="currentColor" viewBox="0 0 20 20">
            <path
              fill-rule="evenodd"
              d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z"
              clip-rule="evenodd"
            />
          </svg>
        </div>

        <p id="evaluator-misc-fee-delete-message" class="curriculum-view__tuition-delete-message">
          Are you sure you want to delete this miscellaneous fee?
        </p>

        <p id="evaluator-misc-fee-delete-detail" class="curriculum-view__tuition-delete-detail">
          {{ miscellaneousFeeLabel }}
        </p>
      </div>

      <footer class="curriculum-view__tuition-delete-footer">
        <button type="button" class="curriculum-view__tuition-delete-btn curriculum-view__tuition-delete-btn--cancel" (click)="onCancel()">
          Cancel
        </button>
        <button type="button" class="curriculum-view__tuition-delete-btn curriculum-view__tuition-delete-btn--delete" (click)="onConfirm()">
          Delete
        </button>
      </footer>
    </div>
  </div>
}
