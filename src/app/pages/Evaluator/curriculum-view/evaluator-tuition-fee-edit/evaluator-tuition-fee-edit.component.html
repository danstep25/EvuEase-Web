@if (isOpen && tuitionFee) {
  <div
    class="curriculum-view__tuition-edit-overlay"
    role="presentation"
    (click)="onBackdropClick()"
    (keydown.escape)="onClose()"
  >
    <div
      class="curriculum-view__tuition-edit-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="evaluator-tuition-edit-title"
      (click)="$event.stopPropagation()"
    >
      <header class="curriculum-view__tuition-edit-header">
        <h2 id="evaluator-tuition-edit-title" class="curriculum-view__tuition-edit-title">Edit Tuition Fee</h2>
        <button type="button" class="curriculum-view__tuition-edit-close" (click)="onClose()" aria-label="Close">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </header>

      <form class="curriculum-view__tuition-edit-form" [formGroup]="editForm" (ngSubmit)="onSubmit()">
        <div class="curriculum-view__tuition-edit-row curriculum-view__tuition-edit-row--2">
          <div class="curriculum-view__tuition-edit-field">
            <label class="curriculum-view__tuition-edit-label" for="eval-tuition-syid">
              School Year ID <span class="curriculum-view__tuition-edit-required">*</span>
            </label>
            <div class="curriculum-view__tuition-edit-select-wrap">
              <select id="eval-tuition-syid" class="curriculum-view__tuition-edit-select" formControlName="syId">
                @for (opt of schoolYearOptions; track opt.value) {
                  <option [value]="opt.value">{{ opt.label }}</option>
                }
              </select>
            </div>
          </div>

          <div class="curriculum-view__tuition-edit-field">
            <label class="curriculum-view__tuition-edit-label" for="eval-tuition-batch">
              Batch <span class="curriculum-view__tuition-edit-required">*</span>
            </label>
            <div class="curriculum-view__tuition-edit-select-wrap">
              <select id="eval-tuition-batch" class="curriculum-view__tuition-edit-select" formControlName="batch">
                @for (batch of batchOptions; track batch) {
                  <option [value]="batch">{{ batch }}</option>
                }
              </select>
            </div>
          </div>
        </div>

        <div class="curriculum-view__tuition-edit-row curriculum-view__tuition-edit-row--2">
          <div class="curriculum-view__tuition-edit-field">
            <label class="curriculum-view__tuition-edit-label" for="eval-tuition-semester">
              Semester <span class="curriculum-view__tuition-edit-required">*</span>
            </label>
            <div class="curriculum-view__tuition-edit-select-wrap">
              <select id="eval-tuition-semester" class="curriculum-view__tuition-edit-select" formControlName="semester">
                @for (sem of semesterOptions; track sem) {
                  <option [value]="sem">{{ sem }}</option>
                }
              </select>
            </div>
          </div>

          <div class="curriculum-view__tuition-edit-field">
            <label class="curriculum-view__tuition-edit-label" for="eval-tuition-code">
              Course Code <span class="curriculum-view__tuition-edit-required">*</span>
            </label>
            <input
              id="eval-tuition-code"
              type="text"
              class="curriculum-view__tuition-edit-input"
              formControlName="courseCode"
              autocomplete="off"
            />
          </div>
        </div>

        <div class="curriculum-view__tuition-edit-row">
          <div class="curriculum-view__tuition-edit-field">
            <label class="curriculum-view__tuition-edit-label" for="eval-tuition-title">
              Course Title <span class="curriculum-view__tuition-edit-required">*</span>
            </label>
            <input
              id="eval-tuition-title"
              type="text"
              class="curriculum-view__tuition-edit-input"
              formControlName="courseTitle"
              autocomplete="off"
            />
          </div>
        </div>

        <div class="curriculum-view__tuition-edit-row curriculum-view__tuition-edit-row--3">
          <div class="curriculum-view__tuition-edit-field">
            <label class="curriculum-view__tuition-edit-label" for="eval-tuition-component">
              Component <span class="curriculum-view__tuition-edit-required">*</span>
            </label>
            <div class="curriculum-view__tuition-edit-select-wrap">
              <select id="eval-tuition-component" class="curriculum-view__tuition-edit-select" formControlName="component">
                @for (comp of componentOptions; track comp) {
                  <option [value]="comp">{{ comp }}</option>
                }
              </select>
            </div>
          </div>

          <div class="curriculum-view__tuition-edit-field">
            <label class="curriculum-view__tuition-edit-label" for="eval-tuition-units">
              Units <span class="curriculum-view__tuition-edit-required">*</span>
            </label>
            <input
              id="eval-tuition-units"
              type="number"
              class="curriculum-view__tuition-edit-input"
              formControlName="units"
              min="1"
              step="1"
            />
          </div>

          <div class="curriculum-view__tuition-edit-field">
            <label class="curriculum-view__tuition-edit-label" for="eval-tuition-cash">
              Cash Amount <span class="curriculum-view__tuition-edit-required">*</span>
            </label>
            <input
              id="eval-tuition-cash"
              type="number"
              class="curriculum-view__tuition-edit-input"
              formControlName="cash"
              min="0"
              step="1"
            />
          </div>
        </div>

        <div class="curriculum-view__tuition-edit-row">
          <div class="curriculum-view__tuition-edit-field">
            <label class="curriculum-view__tuition-edit-label" for="eval-tuition-low">
              Low Monthly Payment <span class="curriculum-view__tuition-edit-required">*</span>
            </label>
            <input
              id="eval-tuition-low"
              type="number"
              class="curriculum-view__tuition-edit-input"
              formControlName="lowMonthlyPayment"
              min="0"
              step="1"
            />
          </div>
        </div>

        <footer class="curriculum-view__tuition-edit-footer">
          <button type="button" class="curriculum-view__tuition-edit-btn curriculum-view__tuition-edit-btn--cancel" (click)="onClose()">
            Cancel
          </button>
          <button type="submit" class="curriculum-view__tuition-edit-btn curriculum-view__tuition-edit-btn--submit">
            Update Tuition Fee
          </button>
        </footer>
      </form>
    </div>
  </div>
}
