@if (isOpen) {
  <div
    class="curriculum-view__tuition-edit-overlay"
    role="presentation"
    (keydown.escape)="onClose()"
  >
    <div
      class="curriculum-view__tuition-edit-dialog"
      role="dialog"
      aria-modal="true"
      aria-label="Add Tuition Fee"
      (click)="$event.stopPropagation()"
    >
      <header class="curriculum-view__tuition-edit-header curriculum-view__tuition-edit-header--close-only">
        <button type="button" class="curriculum-view__tuition-edit-close" (click)="onClose()" aria-label="Close">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </header>

      <form class="curriculum-view__tuition-edit-form curriculum-view__tuition-edit-form--add" [formGroup]="addForm" (ngSubmit)="onSubmit()">
        @if (errorMessage) {
          <div class="curriculum-view__tuition-edit-error" role="alert">{{ errorMessage }}</div>
        }

        <div class="curriculum-view__tuition-edit-row curriculum-view__tuition-edit-row--2">
          <div class="curriculum-view__tuition-edit-field">
            <label class="curriculum-view__tuition-edit-label" for="eval-tuition-add-syid">
              School Year ID <span class="curriculum-view__tuition-edit-required">*</span>
            </label>
            <div class="curriculum-view__tuition-edit-select-wrap">
              <select id="eval-tuition-add-syid" class="curriculum-view__tuition-edit-select" formControlName="syId">
                <option value="">Select school year</option>
                @for (opt of schoolYearOptions; track opt.value) {
                  <option [value]="opt.value">{{ opt.label }}</option>
                }
              </select>
            </div>
          </div>

          <div class="curriculum-view__tuition-edit-field">
            <label class="curriculum-view__tuition-edit-label" for="eval-tuition-add-batch">
              Batch <span class="curriculum-view__tuition-edit-required">*</span>
            </label>
            <div class="curriculum-view__tuition-edit-select-wrap">
              <select id="eval-tuition-add-batch" class="curriculum-view__tuition-edit-select" formControlName="batch">
                @for (batch of batchOptions; track batch) {
                  <option [value]="batch">{{ batch }}</option>
                }
              </select>
            </div>
          </div>
        </div>

        <div class="curriculum-view__tuition-edit-row curriculum-view__tuition-edit-row--2">
          <div class="curriculum-view__tuition-edit-field">
            <label class="curriculum-view__tuition-edit-label" for="eval-tuition-add-semester">
              Semester <span class="curriculum-view__tuition-edit-required">*</span>
            </label>
            <div class="curriculum-view__tuition-edit-select-wrap">
              <select id="eval-tuition-add-semester" class="curriculum-view__tuition-edit-select" formControlName="semester">
                <option value="">Select semester</option>
                @for (sem of semesterOptions; track sem) {
                  <option [value]="sem">{{ sem }}</option>
                }
              </select>
            </div>
          </div>

          <div class="curriculum-view__tuition-edit-field">
            <label class="curriculum-view__tuition-edit-label" for="eval-tuition-add-code">
              Course Code <span class="curriculum-view__tuition-edit-required">*</span>
            </label>
            <div class="curriculum-view__tuition-edit-select-wrap">
              <select
                id="eval-tuition-add-code"
                class="curriculum-view__tuition-edit-select"
                formControlName="courseCode"
                [disabled]="isLoadingCourses || courseOptions.length === 0"
              >
                <option value="">Select course</option>
                @for (course of courseOptions; track course.value) {
                  <option [value]="course.value">{{ course.label }}</option>
                }
              </select>
            </div>
          </div>
        </div>

        <div class="curriculum-view__tuition-edit-row">
          <div class="curriculum-view__tuition-edit-field">
            <label class="curriculum-view__tuition-edit-label" for="eval-tuition-add-title">
              Course Title <span class="curriculum-view__tuition-edit-required">*</span>
            </label>
            <input
              id="eval-tuition-add-title"
              type="text"
              class="curriculum-view__tuition-edit-input curriculum-view__tuition-edit-input--readonly"
              formControlName="courseTitle"
              autocomplete="off"
              readonly
              tabindex="-1"
            />
          </div>
        </div>

        <div class="curriculum-view__tuition-edit-row curriculum-view__tuition-edit-row--3">
          <div class="curriculum-view__tuition-edit-field">
            <label class="curriculum-view__tuition-edit-label" for="eval-tuition-add-component">
              Component <span class="curriculum-view__tuition-edit-required">*</span>
            </label>
            <div class="curriculum-view__tuition-edit-select-wrap">
              <select id="eval-tuition-add-component" class="curriculum-view__tuition-edit-select" formControlName="component">
                @for (comp of componentOptions; track comp) {
                  <option [value]="comp">{{ comp }}</option>
                }
              </select>
            </div>
          </div>

          <div class="curriculum-view__tuition-edit-field">
            <label class="curriculum-view__tuition-edit-label" for="eval-tuition-add-units">
              Units <span class="curriculum-view__tuition-edit-required">*</span>
            </label>
            <input
              id="eval-tuition-add-units"
              type="number"
              class="curriculum-view__tuition-edit-input"
              formControlName="units"
              min="0.5"
              step="0.01"
            />
          </div>

          <div class="curriculum-view__tuition-edit-field">
            <label class="curriculum-view__tuition-edit-label" for="eval-tuition-add-cash">
              Cash Amount <span class="curriculum-view__tuition-edit-required">*</span>
            </label>
            <input
              id="eval-tuition-add-cash"
              type="number"
              class="curriculum-view__tuition-edit-input"
              formControlName="cash"
              min="0"
              step="1"
            />
          </div>
        </div>

        <div class="curriculum-view__tuition-edit-row">
          <div class="curriculum-view__tuition-edit-field">
            <label class="curriculum-view__tuition-edit-label" for="eval-tuition-add-low">
              Low Monthly Payment <span class="curriculum-view__tuition-edit-required">*</span>
            </label>
            <input
              id="eval-tuition-add-low"
              type="number"
              class="curriculum-view__tuition-edit-input"
              formControlName="lowMonthlyPayment"
              min="0"
              step="1"
            />
          </div>
        </div>

        <footer class="curriculum-view__tuition-edit-footer">
          <button type="button" class="curriculum-view__tuition-edit-btn curriculum-view__tuition-edit-btn--cancel" (click)="onClose()">
            Cancel
          </button>
          <button
            type="submit"
            class="curriculum-view__tuition-edit-btn curriculum-view__tuition-edit-btn--submit"
            [disabled]="isSubmitting"
          >
            Add Tuition Fee
          </button>
        </footer>
      </form>
    </div>
  </div>
}
