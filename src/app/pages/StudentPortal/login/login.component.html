<div class="login-container">
  <div class="branding-section">
    <div class="branding-content">
      <div class="icon-wrapper">
        <div class="icon-circle">
          <svg class="graduation-icon" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z" />
          </svg>
        </div>
      </div>
      <h1 class="app-title">EvalEase</h1>
      <p class="app-subtitle">Student Portal</p>
      <p class="institution-name">Track subjects, grades, and academic progress</p>
      <div class="decorative-shapes" aria-hidden="true">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
      </div>
    </div>
  </div>

  <div class="form-section">
    <div class="login-card">
      <div class="card-header">
        <h2 class="welcome-text">Student Sign In</h2>
        <p class="welcome-subtext">Use your student number and portal password</p>
      </div>

      @if (errorMessage) {
        <div class="banner-error" role="alert">{{ errorMessage }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form" novalidate>
        <div class="form-field">
          <label for="sp-student-number" class="form-label">Student Number</label>
          <div class="input-wrapper">
            <input
              id="sp-student-number"
              type="text"
              class="form-input"
              formControlName="studentNumber"
              autocomplete="username"
            />
          </div>
        </div>
        <div class="form-field">
          <label for="sp-password" class="form-label">Password</label>
          <div class="input-wrapper">
            <input
              id="sp-password"
              type="password"
              class="form-input"
              formControlName="password"
              autocomplete="current-password"
            />
          </div>
        </div>
        <button type="submit" class="sign-in-button" [disabled]="isLoading">
          <span>{{ isLoading ? 'Signing in…' : 'Sign In' }}</span>
        </button>
      </form>

      <p class="guest-link">
        <a routerLink="/student_portal/reset-password">Forgot password? Request a reset</a>
      </p>
      <p class="guest-link">
        <a routerLink="/">Staff login</a>
      </p>
    </div>
  </div>
</div>
