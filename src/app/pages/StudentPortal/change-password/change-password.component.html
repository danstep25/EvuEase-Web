<div class="evaluator-page evaluator-page--form">
  <header class="evaluator-page__header">
    <h1 class="evaluator-page__title">Change Password</h1>
    <p class="evaluator-page__subtitle">Update your student portal password.</p>
  </header>

  <div class="evaluator-surface evaluator-surface--padded">
    @if (errorMessage) {
      <div class="sp-alert" role="alert">{{ errorMessage }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="sp-form-field">
        <label for="currentPassword">Current Password</label>
        <input id="currentPassword" type="password" formControlName="currentPassword" autocomplete="current-password" />
      </div>
      <div class="sp-form-field">
        <label for="newPassword">New Password</label>
        <input id="newPassword" type="password" formControlName="newPassword" autocomplete="new-password" />
      </div>
      <div class="sp-form-field">
        <label for="confirmPassword">Confirm New Password</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword" autocomplete="new-password" />
      </div>
      <button type="submit" class="sp-btn" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Saving…' : 'Update Password' }}
      </button>
    </form>
  </div>
</div>
